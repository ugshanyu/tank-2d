<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TANK — tilt to move, tap to shoot</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e14">
<style>
  /* env(safe-area-inset-*) resolves to 0 in a nested browsing context, and this
     game ships inside the host app's iframe — so the HUD landed under the Dynamic
     Island on every notched iPhone. Fall back to a real inset when we detect we
     are framed; main.js overrides these if the host reports true values. */
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
          --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
  :root.framed { --sat: 48px; --sab: 26px; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0e14; color: #e8eef7;
    font-family: system-ui, -apple-system, sans-serif; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: fixed; inset: 0; touch-action: none; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none;
    padding: calc(var(--sat) + 10px) calc(var(--sar) + 12px)
             calc(var(--sab) + 10px) calc(var(--sal) + 12px); }
  #scores { position: absolute; top: inherit; left: inherit; font-size: 13px; line-height: 1.5;
    background: rgba(6,10,18,0.55); border-radius: 10px; padding: 8px 12px; min-width: 110px;
    top: calc(var(--sat) + 10px); left: calc(var(--sal) + 12px); }
  #scores .me { color: #8be9fd; font-weight: 700; }
  #status { position: absolute; top: calc(var(--sat) + 10px);
    right: calc(var(--sar) + 12px); text-align: right; font-size: 12px;
    color: #9fb4d0; background: rgba(6,10,18,0.55); border-radius: 10px; padding: 8px 12px; }
  #status .bad { color: #ff8a80; }
  /* Hidden: it duplicated the settings sheet's "Level now" row while sitting in
     the joystick zone, so resting a driving thumb re-levelled tilt mid-drive. */
  #calibrate { display: none !important; }
  /* kill feed — a 2v2 had no readable narrative; you never saw who killed whom */
  #feed { position: absolute; top: calc(var(--sat) + 10px); right: calc(var(--sar) + 12px);
    display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    margin-top: 40px; font-size: 12px; }
  #feed div { background: rgba(6,10,18,0.6); border-radius: 7px; padding: 3px 8px;
    animation: slidein .18s ease-out both; }
  @keyframes slidein { from { opacity: 0; transform: translateX(14px); } }
  #killbanner { position: absolute; left: 50%; top: 34%; transform: translateX(-50%);
    font-size: 22px; font-weight: 900; letter-spacing: 3px; color: #fff;
    text-shadow: 0 2px 20px rgba(0,0,0,.9); opacity: 0; }
  #killbanner.on { animation: slam .5s cubic-bezier(.16,1,.3,1) both; }
  @keyframes slam { 0% { opacity: 0; transform: translateX(-50%) scale(1.6); }
                    18% { opacity: 1; transform: translateX(-50%) scale(1); }
                    75% { opacity: 1; } 100% { opacity: 0; } }
  #toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
    background: rgba(6,10,18,0.75); padding: 10px 18px; border-radius: 12px;
    font-size: 15px; opacity: 0; transition: opacity .3s; text-align: center; }
  #respawn { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800; letter-spacing: 2px; color: #ff8a80;
    text-shadow: 0 2px 18px rgba(0,0,0,.8); flex-direction: column; gap: 8px;
    opacity: 0; visibility: hidden; transform: scale(1.14);
    transition: opacity .16s ease-out, transform .24s cubic-bezier(.16,1,.3,1), visibility 0s .16s; }
  #respawn.on { opacity: 1; visibility: visible; transform: scale(1); transition-delay: 0s; }
  #respawn small { font-size: 14px; font-weight: 500; color: #9fb4d0; letter-spacing: 0; }

  /* damage vignette — taking a hit used to produce no feedback whatsoever */
  #hurt { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0;
    box-shadow: inset 0 0 54px 6px rgba(255,40,40,.5);
    transition: opacity .3s ease-out; }
  #hurt.on { opacity: .85; transition-duration: .05s; }

  /* team scoreboard rows */
  #scores .row { display: flex; justify-content: space-between; gap: 10px; }
  #scores .hdr { font-weight: 800; letter-spacing: 1px; font-size: 11px; opacity: .85; margin-top: 4px; }
  #scores .hdr:first-child { margin-top: 0; }
  #scores .me { font-weight: 700; }
  #scores i { font-style: normal; font-size: 11px; letter-spacing: .5px; color: #8b9dc0;
    border: 1px solid #33405c; border-radius: 4px; padding: 0 3px; margin-left: 5px;
    vertical-align: middle; }

  /* match result */
  #match { position: fixed; inset: 0; z-index: 5; display: flex; pointer-events: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(6,10,18,0.72); text-align: center;
    opacity: 0; visibility: hidden; backdrop-filter: blur(2px);
    transition: opacity .22s ease-out, visibility 0s .22s; }
  #match.on { opacity: 1; visibility: visible; transition-delay: 0s; }
  @media (prefers-reduced-motion: no-preference) {
    #match.on .who { animation: pop .34s cubic-bezier(.16,1,.3,1) both; }
  }
  @keyframes pop { from { transform: scale(1.45); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #match .who { font-size: 40px; font-weight: 900; letter-spacing: 6px; }
  #match .sub { font-size: 15px; color: #9fb4d0; }
  #match .tally { font-size: 13px; color: #8b9dc0; letter-spacing: 1px; }

  /* 44x44pt minimum tap targets, per the iOS HIG */
  .icon-btn { position: absolute; width: 44px; height: 44px; display: flex;
    align-items: center; justify-content: center; pointer-events: auto;
    background: rgba(6,10,18,0.55); border: none; border-radius: 12px;
    color: #cfe3ff; font-size: 19px; cursor: pointer; }
  .icon-btn:active { transform: scale(.94); }
  /* Bottom-CENTRE, in the letterbox band BELOW the arena: out of the playfield,
     clear of the scoreboard, and far from where a thumb rests. On the right it sat
     inside the aim/fire zone, so aiming at the top-right corner opened settings
     mid-fight (and in tilt mode the whole screen is the fire zone). */
  #gear { bottom: calc(var(--sab) + 8px); left: 50%; margin-left: -22px;
    background: rgba(6,10,18,0.7); }

  /* settings sheet */
  #sheet { position: fixed; inset: 0; z-index: 8; display: flex; align-items: flex-end;
    justify-content: center; background: rgba(4,7,12,.6); opacity: 0; visibility: hidden;
    transition: opacity .2s ease-out, visibility 0s .2s; }
  #sheet.on { opacity: 1; visibility: visible; transition-delay: 0s; }
  #sheet .card { width: 100%; max-width: 460px; background: #141a26; border-radius: 18px 18px 0 0;
    padding: 18px 18px calc(var(--sab) + 22px); transform: translateY(100%);
    transition: transform .26s cubic-bezier(.16,1,.3,1); }
  #sheet.on .card { transform: translateY(0); }
  #sheet h2 { font-size: 15px; letter-spacing: 2px; color: #8be9fd; margin-bottom: 14px; }
  #sheet .row { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-top: 1px solid #222b3c; font-size: 15px; }
  #sheet .seg { display: flex; gap: 6px; }
  #sheet .seg button, #sheet .row > button { min-height: 44px; padding: 0 14px; border-radius: 9px;
    border: 1px solid #33405c; background: transparent; color: #cfe3ff; font-size: 14px; cursor: pointer; }
  #sheet .seg button.sel { background: #1f8fd6; border-color: #1f8fd6; color: #06131f; font-weight: 700; }
  #sheet .seg button:disabled { opacity: .35; }
  #sheet .close { width: 100%; margin-top: 16px; min-height: 46px; border-radius: 12px;
    border: none; background: #1f8fd6; color: #06131f; font-weight: 800; font-size: 16px;
    letter-spacing: 1px; cursor: pointer; }

  /* first-run how-to-play */
  #intro { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; text-align: center;
    padding: 30px; background: rgba(6,10,18,.86); backdrop-filter: blur(3px);
    opacity: 0; visibility: hidden; transition: opacity .25s ease-out, visibility 0s .25s; }
  #intro.on { opacity: 1; visibility: visible; transition-delay: 0s; }
  #intro h1 { font-size: 34px; letter-spacing: 8px; color: #8be9fd; }
  #intro .steps { display: flex; flex-direction: column; gap: 14px; max-width: 300px; }
  #intro .step { display: flex; gap: 12px; align-items: center; text-align: left; font-size: 14px;
    color: #cfe3ff; line-height: 1.4; }
  #intro .step b { display: flex; width: 32px; height: 32px; flex: 0 0 32px; border-radius: 9px;
    background: #1c2740; color: #8be9fd; align-items: center; justify-content: center; font-size: 15px; }
  #intro .go { min-height: 50px; padding: 0 46px; border-radius: 13px; border: none;
    background: linear-gradient(180deg, #35c3ef, #1f8fd6); color: #06131f;
    font-size: 17px; font-weight: 800; letter-spacing: 3px; cursor: pointer; }

  /* connection loss must be legible as frozen, not mistaken for lag */
  #offline { position: fixed; inset: 0; z-index: 7; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 10px; pointer-events: none;
    background: rgba(6,10,18,.62); font-size: 17px; letter-spacing: 2px; color: #ff8a80;
    opacity: 0; visibility: hidden; transition: opacity .2s, visibility 0s .2s; }
  #offline.on { opacity: 1; visibility: visible; transition-delay: 0s; }
  #offline small { font-size: 13px; letter-spacing: 0; color: #9fb4d0; }

  /* The arena is 9:16. In landscape the fit-to-height zoom renders it as a ~220px
     sliver in the middle of the screen, and the tilt axis mapping flips under the
     player mid-match. Declare portrait and mean it. */
  #rotate { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: #0b0e14;
    text-align: center; font-size: 17px; letter-spacing: 1px; color: #cfe3ff; }
  #rotate span { font-size: 44px; }
  @media (orientation: landscape) and (max-height: 560px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="scores"></div>
  <div id="status"></div>
  <div id="respawn"><span>DESTROYED</span><small id="respawnIn"></small></div>
  <div id="feed"></div>
  <div id="killbanner"></div>
  <div id="toast"></div>
  <button id="calibrate">⟳ level tilt</button>
  <button id="gear" class="icon-btn" aria-label="Settings">⚙</button>
</div>

<div id="offline"><span>RECONNECTING</span><small id="offlineSub"></small></div>

<div id="rotate"><span>📱</span><div>Rotate your device<br>to play in portrait</div></div>

<div id="sheet">
  <div class="card">
    <h2>SETTINGS</h2>
    <div class="row"><span>Steering</span>
      <span class="seg">
        <button id="optStick">Joystick</button>
        <button id="optTilt">Tilt</button>
      </span>
    </div>
    <div class="row"><span>Sound</span><button id="optSound">On</button></div>
    <div class="row"><span>Vibration</span><button id="optHaptics">On</button></div>
    <div class="row"><span>Screen shake</span>
      <span class="seg">
        <button id="shake0">Off</button>
        <button id="shake1">Low</button>
        <button id="shake2">Full</button>
      </span>
    </div>
    <div class="row"><span>Re-centre tilt</span><button id="optCal">Level now</button></div>
    <div class="row"><span>How to play</span><button id="optHelp">Show</button></div>
    <button class="close" id="sheetClose">DONE</button>
  </div>
</div>

<div id="intro">
  <h1>TANK</h1>
  <div class="steps">
    <div class="step"><b>1</b><span id="introDrive">Drag the left side to drive.</span></div>
    <div class="step"><b>2</b><span>Touch the right side to aim and shoot.</span></div>
    <div class="step"><b>3</b><span>Destroy the enemy tower to win. It shoots back.</span></div>
  </div>
  <button class="go" id="introGo">PLAY</button>
</div>

<div id="hurt"></div>

<div id="match">
  <div class="who" id="matchWho"></div>
  <div class="sub" id="matchSub"></div>
  <div class="tally" id="matchTally"></div>
</div>

<!-- Usion platform SDK: injected identity, wallet, rooms, direct-mode access.
     No-ops gracefully when opened outside the Usion host (standalone/dev). -->
<script src="https://usions.com/usion-sdk.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
