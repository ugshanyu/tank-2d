<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TANK — tilt to move, tap to shoot</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e14">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0e14; color: #e8eef7;
    font-family: system-ui, -apple-system, sans-serif; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: fixed; inset: 0; touch-action: none; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px)
             calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 12px); }
  #scores { position: absolute; top: inherit; left: inherit; font-size: 13px; line-height: 1.5;
    background: rgba(6,10,18,0.55); border-radius: 10px; padding: 8px 12px; min-width: 110px;
    top: calc(env(safe-area-inset-top) + 10px); left: calc(env(safe-area-inset-left) + 12px); }
  #scores .me { color: #8be9fd; font-weight: 700; }
  #status { position: absolute; top: calc(env(safe-area-inset-top) + 10px);
    right: calc(env(safe-area-inset-right) + 12px); text-align: right; font-size: 12px;
    color: #9fb4d0; background: rgba(6,10,18,0.55); border-radius: 10px; padding: 8px 12px; }
  #status .bad { color: #ff8a80; }
  #calibrate { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 14px);
    left: calc(env(safe-area-inset-left) + 14px); pointer-events: auto; display: none;
    background: rgba(20,30,48,0.8); color: #cfe3ff; border: 1px solid #33507a;
    border-radius: 12px; padding: 10px 16px; font-size: 14px; }
  #toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
    background: rgba(6,10,18,0.75); padding: 10px 18px; border-radius: 12px;
    font-size: 15px; opacity: 0; transition: opacity .3s; text-align: center; }
  #respawn { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800; letter-spacing: 2px; color: #ff8a80;
    text-shadow: 0 2px 18px rgba(0,0,0,.8); flex-direction: column; gap: 8px; }
  #respawn small { font-size: 14px; font-weight: 500; color: #9fb4d0; letter-spacing: 0; }

  /* start overlay */
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #131a28 0%, #0b0e14 75%); z-index: 10; }
  #start .card { text-align: center; padding: 24px; max-width: 340px; width: 90%; }
  #start h1 { font-size: 44px; letter-spacing: 10px; margin-bottom: 4px; color: #8be9fd;
    text-shadow: 0 0 26px rgba(139,233,253,.35); }
  #start p { color: #9fb4d0; font-size: 14px; margin-bottom: 22px; }
  #whoami { color: #8be9fd; font-size: 14px; font-weight: 600; margin-bottom: 16px; min-height: 18px; }
  #play { width: 100%; padding: 15px; font-size: 18px; font-weight: 800; letter-spacing: 3px;
    border: none; border-radius: 12px; background: linear-gradient(180deg, #35c3ef, #1f8fd6);
    color: #06131f; cursor: pointer; }
  #play:active { transform: scale(0.98); }
  #start .hint { margin-top: 16px; font-size: 12px; color: #64769a; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="scores"></div>
  <div id="status"></div>
  <div id="respawn"><span>DESTROYED</span><small id="respawnIn"></small></div>
  <div id="toast"></div>
  <button id="calibrate">⟳ level tilt</button>
</div>

<div id="start">
  <div class="card">
    <h1>TANK</h1>
    <p>Tilt your phone to drive.<br>Touch anywhere to aim &amp; shoot.</p>
    <div id="whoami"></div>
    <button id="play">PLAY</button>
    <div class="hint">No tilt sensor? You get a joystick (left half) —<br>or WASD + mouse on desktop.</div>
  </div>
</div>

<!-- Usion platform SDK: injected identity, wallet, rooms, direct-mode access.
     No-ops gracefully when opened outside the Usion host (standalone/dev). -->
<script src="https://usions.com/usion-sdk.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
